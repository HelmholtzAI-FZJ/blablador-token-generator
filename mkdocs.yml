site_name: Blablador Token Generator
site_description: API tokens for Blablador, issued after Helmholtz/JSC sign-in
site_url: https://helmholtzai-fzj.github.io/blablador-token-generator/
repo_url: https://github.com/HelmholtzAI-FZJ/blablador-token-generator
repo_name: HelmholtzAI-FZJ/blablador-token-generator
edit_uri: edit/main/docs/
copyright: Helmholtz AI, Forschungszentrum Jülich

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Using the service:
      - User guide: user-guide.md
      - API reference: api.md
  - Deployment:
      - Production checklist: deployment/checklist.md
      - Kubernetes (Helm): deployment/kubernetes.md
      - Docker Compose: deployment/docker-compose.md
      - Configuration reference: configuration.md
  - Operations:
      - Administration: operations/administration.md
      - Upgrades and migrations: operations/upgrades.md
      - Backups and restore: operations/backups.md
      - Monitoring and logging: operations/monitoring.md
      - Incident response: operations/incidents.md
  - Security: security.md
  - Development: development.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
