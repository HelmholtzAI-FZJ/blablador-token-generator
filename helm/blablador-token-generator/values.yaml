replicaCount: 2
image:
  repository: registry.jsc.fz-juelich.de/kaas/rke2-clusters/blablador/blablador-token-generator
  pullPolicy: IfNotPresent
  tag: ''
  digest: ''
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 64k
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
  hosts:
  - host: tokens.example.com
    paths:
    - path: /
      pathType: Prefix
  tls:
  - secretName: token-generator-tls
    hosts:
    - tokens.example.com
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 30
readinessProbe:
  httpGet:
    path: /readyz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
forwardedAllowIps: ''
networkPolicy:
  enabled: true
  app:
    enabled: true
    from: []
    egress:
      enabled: true
      extraRules: []
redis:
  enabled: true
  password: ''
  image:
    repository: registry.jsc.fz-juelich.de/kaas/rke2-clusters/blablador/blablador-token-generator-redis
    tag: ''
    digest: ''
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  existingSecret: ''
  tls:
    enabled: true
    existingSecret: ''
  maxmemory: 64mb
postgresql:
  enabled: true
  username: tokens
  database: tokens
  password: ''
  image:
    repository: registry.jsc.fz-juelich.de/kaas/rke2-clusters/blablador/blablador-token-generator-postgresql
    tag: ''
    digest: ''
  storageClass: ''
  size: 5Gi
  resources:
    limits:
      cpu: '1'
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  existingSecret: ''
  adminUsername: token_admin
  adminPassword: ''
  tls:
    enabled: true
    existingSecret: ''
persistence:
  enabled: true
  storageClass: ''
  accessMode: ReadWriteOnce
  size: 1Gi
config:
  app:
    name: Token Generator
    host: 0.0.0.0
    port: 8080
    secret_key: ''
    token_hash_key: ''
    debug: false
    api_url: https://tokens.example.com
    secure_cookies: true
    environment: production
    jwt_expiration_hours: 24
    admin_jwt_expiration_hours: 1
    log_level: INFO
    max_body_bytes: 65536
    body_timeout_seconds: 10.0
    max_concurrent_requests: 128
    readiness_timeout_seconds: 2.0
  database:
    url: sqlite+aiosqlite:///./data/tokens.db
    echo: false
    ssl_ca_file: ''
    connect_timeout_seconds: 5.0
    statement_timeout_seconds: 5.0
    lock_timeout_seconds: 2.0
    idle_transaction_timeout_seconds: 15.0
  oauth:
    client_id: your-client-id
    client_secret: ''
    authorize_url: https://login.jsc.fz-juelich.de/oauth2-as/oauth2-authz
    token_url: https://login.jsc.fz-juelich.de/oauth2/token
    userinfo_url: https://login.jsc.fz-juelich.de/oauth2/userinfo
    redirect_uri: https://tokens.example.com/oauth/openid/callback
    scopes:
    - openid
    - profile
    - email
    trust_provider_emails: false
    request_timeout_seconds: 10.0
    max_response_bytes: 65536
  login:
    name: JSC Login
    description: Authenticate with JSC Login
  tokens:
    default_expiration_days: 365
    max_expiration_days: 365
    token_length_bytes: 32
    max_tokens_per_user: 100
    token_prefix: blablador
    last_used_update_seconds: 60
  rate_limits:
    pages: 120/minute
    oauth_callback: 60/minute
    local_login: 10/minute
    tokens_read: 60/minute
    tokens_write: 30/minute
    session: 30/minute
    account_delete: 5/minute
    admin: 120/minute
    token_validation: 600/minute
    token_validation_exempt: []
    preauth: 240/minute
    local_login_account: 5/minute
    storage_timeout_seconds: 0.5
  admin:
    admin_subjects: []
    admin_emails: []
  local:
    enabled: false
    allow_registration: false
    max_concurrent_password_operations: 4
  blablador:
    api_url: https://ptj.blablador.fz-juelich.de
    models: []
workers: 2
configExistingSecret: ''
secretRevision: ''
allowForwardedCidrs: false
databaseBackend: postgresql
