replicaCount: 2
image:
  repository: registry.jsc.fz-juelich.de/kaas/rke2-clusters/blablador/blablador-token-generator
  pullPolicy: IfNotPresent
  tag: ''
  digest: ''
# Pull secrets used by every workload: the app, PostgreSQL, Redis and the
# backup Job. Components also accept their own imagePullSecrets list.
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 64k
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
  hosts:
  - host: tokens.example.com
    paths:
    - path: /
      pathType: Prefix
  tls:
  - secretName: token-generator-tls
    hosts:
    - tokens.example.com
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
# /readyz waits up to readiness_timeout_seconds for the database and again
# for Redis; the probe allows both.
readinessProbe:
  httpGet:
    path: /readyz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
# Startup applies pending database migrations; a pod may wait up to 120 s
# for another pod's migration lock, so allow 180 s.
startupProbe:
  httpGet:
    path: /healthz
    port: 8080
  failureThreshold: 90
  periodSeconds: 2
forwardedAllowIps: ''
# Rolling updates: keep serving this long after termination starts (the
# ingress needs a moment to stop routing to the pod), then let in-flight
# requests finish within the grace period.
shutdownDelaySeconds: 5
terminationGracePeriodSeconds: 30
networkPolicy:
  enabled: true
  app:
    enabled: true
    from: []
    egress:
      enabled: true
      extraRules: []
# Daily `notify-expiring-tokens` CronJob. It needs
# config.notifications.expiry_reminders and config.smtp.enabled too; without
# them the Job exits non-zero and says why.
expiryReminders:
  enabled: false
  schedule: '0 3 * * *'
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 25m
      memory: 96Mi
# Daily `purge-course-tokens` CronJob: deletes the tokens of courses that
# ended more than config.courses.retention_days ago.
coursePurge:
  enabled: false
  schedule: '30 3 * * *'
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 25m
      memory: 96Mi
# Secret holding the SMTP password, injected as SMTP_PASSWORD into the
# application and the expiry-reminder Job. Never put the password in values.
smtpPasswordSecret: ''
smtpPasswordSecretKey: password
redis:
  enabled: true
  password: ''
  image:
    repository: registry.jsc.fz-juelich.de/kaas/rke2-clusters/blablador/blablador-token-generator-redis
    tag: ''
    digest: ''
  # Extra pull secrets for this component, on top of the global
  # imagePullSecrets; entries are deduplicated by name.
  imagePullSecrets: []
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  existingSecret: ''
  tls:
    enabled: true
    existingSecret: ''
  maxmemory: 64mb
postgresql:
  enabled: true
  username: tokens
  database: tokens
  password: ''
  image:
    repository: registry.jsc.fz-juelich.de/kaas/rke2-clusters/blablador/blablador-token-generator-postgresql
    tag: ''
    digest: ''
  # Extra pull secrets for this component (and its backup Job), on top of the
  # global imagePullSecrets; entries are deduplicated by name.
  imagePullSecrets: []
  storageClass: ''
  size: 5Gi
  resources:
    limits:
      cpu: '1'
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  existingSecret: ''
  adminUsername: token_admin
  adminPassword: ''
  tls:
    enabled: true
    existingSecret: ''
  # Nightly pg_dump (custom format) to a dedicated volume, kept for
  # retentionDays. Copy the volume off the cluster as well: a backup on the
  # same storage does not survive losing it.
  backup:
    enabled: false
    schedule: '17 2 * * *'
    retentionDays: 14
    storageClass: ''
    size: 5Gi
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
persistence:
  enabled: true
  storageClass: ''
  accessMode: ReadWriteOnce
  size: 1Gi
config:
  app:
    name: Token Generator
    host: 0.0.0.0
    port: 8080
    secret_key: ''
    token_hash_key: ''
    debug: false
    api_url: https://tokens.example.com
    secure_cookies: true
    environment: production
    jwt_expiration_hours: 24
    admin_jwt_expiration_hours: 1
    log_level: INFO
    access_log: true
    max_body_bytes: 65536
    body_timeout_seconds: 10.0
    max_concurrent_requests: 128
    readiness_timeout_seconds: 2.0
  database:
    url: sqlite+aiosqlite:///./data/tokens.db
    echo: false
    auto_migrate: true
    ssl_ca_file: ''
    connect_timeout_seconds: 5.0
    statement_timeout_seconds: 5.0
    lock_timeout_seconds: 2.0
    idle_transaction_timeout_seconds: 15.0
  oauth:
    client_id: your-client-id
    client_secret: ''
    authorize_url: https://login.jsc.fz-juelich.de/oauth2-as/oauth2-authz
    token_url: https://login.jsc.fz-juelich.de/oauth2/token
    userinfo_url: https://login.jsc.fz-juelich.de/oauth2/userinfo
    redirect_uri: https://tokens.example.com/oauth/openid/callback
    scopes:
    - openid
    - profile
    - email
    trust_provider_emails: false
    request_timeout_seconds: 10.0
    max_response_bytes: 65536
  login:
    name: JSC Login
    description: Authenticate with JSC Login
  tokens:
    default_expiration_days: 365
    max_expiration_days: 365
    token_length_bytes: 32
    max_tokens_per_user: 100
    max_applications_per_user: 20
    token_prefix: blablador
    last_used_update_seconds: 60
  rate_limits:
    pages: 120/minute
    oauth_callback: 60/minute
    local_login: 10/minute
    tokens_read: 60/minute
    tokens_write: 30/minute
    session: 30/minute
    account_delete: 5/minute
    admin: 120/minute
    course_join: 10/minute
    course_invite: 10/minute
    token_validation: 600/minute
    token_validation_exempt: []
    preauth: 240/minute
    local_login_account: 5/minute
    storage_timeout_seconds: 0.5
  admin:
    admin_subjects: []
    admin_emails: []
  smtp:
    enabled: false
    host: ''
    port: 587
    username: ''
    password: ''
    from_address: ''
    starttls: true
    use_tls: false
    timeout_seconds: 10.0
  notifications:
    expiry_reminders: false
    warning_days:
    - 30
    - 7
    - 1
    batch_size: 200
  courses:
    enabled: false
    max_days: 21
    max_seats: 60
    max_active_per_teacher: 1
    max_days_ahead: 180
    join_code_bytes: 24
    retention_days: 30
    invitation_max_body_chars: 4000
    max_invitation_sends: 3
    admin_can_view_invitation_links: false
    terms_version: '1'
  local:
    enabled: false
    allow_registration: false
    max_concurrent_password_operations: 4
  blablador:
    api_url: https://ptj.blablador.fz-juelich.de
    test_url: ''
    models: []
# Uvicorn workers per pod. One worker runs in a single process (about
# 120 MiB); each further one adds as much again plus a supervisor, and only
# helps when the pod has more than one CPU (resources.limits.cpu). Scale
# with replicaCount instead.
workers: 1
configExistingSecret: ''
secretRevision: ''
allowForwardedCidrs: false
databaseBackend: postgresql
