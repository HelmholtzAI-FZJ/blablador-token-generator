{{- if .Values.postgresql.enabled }}
{{- $name := printf "%s-postgresql" (include "blablador-token-generator.fullname" .) }}
{{- $pg := .Values.postgresql }}
{{- if eq $pg.username $pg.adminUsername }}{{- fail "PostgreSQL runtime and administrator usernames must differ" }}{{- end }}
{{- if and (eq .Values.config.app.environment "production") (not $pg.tls.enabled) }}{{- fail "Production PostgreSQL requires verified TLS" }}{{- end }}
{{- if not $pg.existingSecret }}
{{- $adminPassword := required "postgresql.adminPassword or existingSecret is required" $pg.adminPassword }}
{{- $runtimePassword := required "postgresql.password or existingSecret is required" $pg.password }}
{{- if eq $adminPassword $runtimePassword }}{{- fail "PostgreSQL runtime and administrator passwords must differ" }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "blablador-token-generator.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ required "postgresql.adminPassword or existingSecret is required" $pg.adminPassword | quote }}
  password: {{ required "postgresql.password or existingSecret is required" $pg.password | quote }}
  database-url: {{ include "blablador-token-generator.postgresUrl" . | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-init
  labels:
    {{- include "blablador-token-generator.labels" . | nindent 4 }}
data:
  10-runtime-role.sh: |
    {{- .Files.Get "files/init-runtime-role.sh" | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "blablador-token-generator.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/credentials: {{ $pg | toJson | sha256sum }}
        checksum/init: {{ .Files.Get "files/init-runtime-role.sh" | sha256sum }}
        secrets/revision: {{ .Values.secretRevision | quote }}
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: {{ include "blablador-token-generator.image" $pg.image | quote }}
          {{- if $pg.tls.enabled }}
          args:
            - postgres
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/tls/tls.crt
            - -c
            - ssl_key_file=/tls/tls.key
            - -c
            - ssl_ca_file=/tls/ca.crt
            - -c
            - ssl_min_protocol_version=TLSv1.2
          {{- end }}
          env:
            - name: POSTGRES_USER
              value: {{ $pg.adminUsername | quote }}
            - name: POSTGRES_DB
              value: {{ $pg.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "blablador-token-generator.postgresSecret" . }}
                  key: admin-password
            - name: TOKEN_DB_USER
              value: {{ $pg.username | quote }}
            - name: TOKEN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "blablador-token-generator.postgresSecret" . }}
                  key: password
            - name: TOKEN_DB_REQUIRE_TLS
              value: {{ $pg.tls.enabled | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $pg.username | quote }}, "-d", {{ $pg.database | quote }}]
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            {{- if $pg.tls.enabled }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
      volumes:
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: init
          configMap:
            name: {{ $name }}-init
            defaultMode: 0555
        {{- if $pg.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ required "postgresql.tls.existingSecret is required" $pg.tls.existingSecret }}
            defaultMode: 0440
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $pg.storageClass }}
        storageClassName: {{ $pg.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "blablador-token-generator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      name: postgresql
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
