{{- if .Values.redis.enabled }}
{{- $name := include "blablador-token-generator.componentName" (dict "root" . "component" "redis") }}
{{- $redis := .Values.redis }}
{{- if and (eq .Values.config.app.environment "production") (not $redis.tls.enabled) }}{{- fail "Production Redis requires verified TLS" }}{{- end }}
{{- if not $redis.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "blablador-token-generator.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "redis.password or existingSecret is required" $redis.password | quote }}
  storage-uri: {{ include "blablador-token-generator.redisUrl" . | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-startup
  labels:
    {{- include "blablador-token-generator.labels" . | nindent 4 }}
data:
  redis-entrypoint.sh: |
    {{- .Files.Get "files/redis-entrypoint.sh" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "blablador-token-generator.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/credentials: {{ $redis | toJson | sha256sum }}
        checksum/startup: {{ .Files.Get "files/redis-entrypoint.sh" | sha256sum }}
        secrets/revision: {{ .Values.secretRevision | quote }}
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ include "blablador-token-generator.image" $redis.image | quote }}
          command: ["/startup/redis-entrypoint.sh"]
          args:
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - {{ $redis.maxmemory | quote }}
            - --maxmemory-policy
            - noeviction
            {{- if $redis.tls.enabled }}
            - --port
            - "0"
            - --tls-port
            - "6379"
            - --tls-cert-file
            - /tls/tls.crt
            - --tls-key-file
            - /tls/tls.key
            - --tls-ca-cert-file
            - /tls/ca.crt
            - --tls-auth-clients
            - "no"
            - --tls-protocols
            - "TLSv1.2 TLSv1.3"
            {{- end }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "blablador-token-generator.redisSecret" . }}
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                {{- if $redis.tls.enabled }}
                - {{ printf "test \"$(REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli --tls --cacert /tls/ca.crt --sni %s --raw ping)\" = PONG" $name | quote }}
                {{- else }}
                - 'test "$(REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --raw ping)" = PONG'
                {{- end }}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $redis.resources | nindent 12 }}
          volumeMounts:
            - name: startup
              mountPath: /startup
              readOnly: true
            - name: data
              mountPath: /data
            {{- if $redis.tls.enabled }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
      volumes:
        - name: startup
          configMap:
            name: {{ $name }}-startup
            defaultMode: 0555
        - name: data
          emptyDir:
            sizeLimit: 16Mi
        {{- if $redis.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ required "redis.tls.existingSecret is required" $redis.tls.existingSecret }}
            defaultMode: 0440
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "blablador-token-generator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      name: redis
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
