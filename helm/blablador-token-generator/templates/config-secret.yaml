{{- if not .Values.configExistingSecret }}
{{- $_ := required "config.app.secret_key is required unless configExistingSecret is supplied" .Values.config.app.secret_key }}
{{- $_ := required "config.app.token_hash_key is required unless configExistingSecret is supplied" .Values.config.app.token_hash_key }}
{{- $config := deepCopy .Values.config }}
{{- if and .Values.postgresql.enabled .Values.postgresql.tls.enabled }}
{{- $_ := set $config.database "ssl_ca_file" "/app/tls/postgresql/ca.crt" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "blablador-token-generator.fullname" . }}-config
  labels:
    {{- include "blablador-token-generator.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- toYaml $config | nindent 4 }}
{{- end }}
