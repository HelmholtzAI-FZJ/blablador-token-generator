apiVersion: v1
kind: Secret
metadata:
  name: {{ include "blablador-token-generator.fullname" . }}-config
  labels:
    {{- include "blablador-token-generator.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    app:
      name: {{ .Values.config.app.name | quote }}
      host: {{ .Values.config.app.host | quote }}
      port: {{ .Values.config.app.port }}
      secret_key: {{ .Values.config.app.secret_key | quote }}
      debug: {{ .Values.config.app.debug }}
      api_url: {{ .Values.config.app.api_url | quote }}

    database:
      url: {{ .Values.config.database.url | quote }}

    oauth:
      client_id: {{ .Values.config.oauth.client_id | quote }}
      client_secret: {{ .Values.config.oauth.client_secret | quote }}
      authorize_url: {{ .Values.config.oauth.authorize_url | quote }}
      token_url: {{ .Values.config.oauth.token_url | quote }}
      userinfo_url: {{ .Values.config.oauth.userinfo_url | quote }}
      redirect_uri: {{ .Values.config.oauth.redirect_uri | quote }}
      scopes:
        {{- range .Values.config.oauth.scopes }}
        - {{ . | quote }}
        {{- end }}

    login:
      name: {{ .Values.config.login.name | quote }}
      description: {{ .Values.config.login.description | quote }}

    tokens:
      default_expiration_days: {{ .Values.config.tokens.default_expiration_days }}
      token_length_bytes: {{ .Values.config.tokens.token_length_bytes }}

    admin:
      admin_emails:
        {{- range .Values.config.admin.admin_emails }}
        - {{ . | quote }}
        {{- end }}