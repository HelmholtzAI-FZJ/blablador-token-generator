{{- $sqlite := eq .Values.databaseBackend "sqlite" }}
{{- $production := eq .Values.config.app.environment "production" }}
{{- if and $sqlite (gt (int .Values.replicaCount) 1) }}
{{- fail "SQLite supports only replicaCount: 1" }}
{{- end }}
{{- if and $sqlite $production }}{{- fail "SQLite is development only" }}{{- end }}
{{- if and $production (or (not .Values.networkPolicy.enabled) (not .Values.networkPolicy.app.enabled) (not .Values.networkPolicy.app.egress.enabled)) }}
{{- fail "Production requires the app ingress NetworkPolicy and explicit trusted peers" }}
{{- end }}
{{- $forwarded := required "forwardedAllowIps must identify the actual trusted ingress source addresses" .Values.forwardedAllowIps }}
{{- if contains "*" $forwarded }}{{- fail "Wildcard forwarded-header trust is forbidden" }}{{- end }}
{{- if and (contains "/" $forwarded) (not .Values.allowForwardedCidrs) }}
{{- fail "Use exact ingress source IPs; CIDRs require explicit allowForwardedCidrs and isolated trusted peers" }}
{{- end }}
{{- if $sqlite }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "blablador-token-generator.fullname" . }}-db
  labels:
    {{- include "blablador-token-generator.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.persistence.accessMode | quote }}]
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blablador-token-generator.fullname" . }}
  labels:
    {{- include "blablador-token-generator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "blablador-token-generator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config-secret.yaml") . | sha256sum }}
        checksum/postgresql: {{ .Values.postgresql | toJson | sha256sum }}
        checksum/redis: {{ .Values.redis | toJson | sha256sum }}
        secrets/revision: {{ .Values.secretRevision | quote }}
      labels:
        {{- include "blablador-token-generator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "blablador-token-generator.selectorLabels" . | nindent 14 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          image: {{ include "blablador-token-generator.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: APP_ENVIRONMENT
              value: {{ .Values.config.app.environment | quote }}
            - name: CONFIG_PATH
              value: /app/config/config.yaml
            - name: WORKERS
              value: {{ .Values.workers | quote }}
            - name: FORWARDED_ALLOW_IPS
              value: {{ $forwarded | quote }}
            {{- if .Values.postgresql.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "blablador-token-generator.postgresSecret" . }}
                  key: database-url
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: RATE_LIMIT_STORAGE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "blablador-token-generator.redisSecret" . }}
                  key: storage-uri
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            {{- if $sqlite }}
            - name: token-db
              mountPath: /app/data
            {{- end }}
            {{- range $component := list "postgresql" "redis" }}
            {{- if (index $.Values $component).tls.enabled }}
            - name: {{ $component }}-ca
              mountPath: /app/tls/{{ $component }}
              readOnly: true
            {{- end }}
            {{- end }}
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: config
          secret:
            secretName: {{ include "blablador-token-generator.configSecret" . }}
            defaultMode: 0440
        {{- range $component := list "postgresql" "redis" }}
        {{- $tls := (index $.Values $component).tls }}
        {{- if $tls.enabled }}
        - name: {{ $component }}-ca
          secret:
            secretName: {{ required (printf "%s.tls.existingSecret with ca.crt is required" $component) $tls.existingSecret }}
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- end }}
        {{- if $sqlite }}
        - name: token-db
          persistentVolumeClaim:
            claimName: {{ include "blablador-token-generator.fullname" . }}-db
        {{- end }}
