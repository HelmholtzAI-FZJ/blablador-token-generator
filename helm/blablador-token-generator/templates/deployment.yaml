{{- $sqlite := not .Values.postgresql.enabled }}
{{- if and $sqlite (gt (int .Values.replicaCount) 1) }}
{{- fail "SQLite supports only replicaCount: 1; enable postgresql for more replicas" }}
{{- end }}
{{- if $sqlite }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "blablador-token-generator.fullname" . }}-db
  labels:
    {{- include "blablador-token-generator.labels" . | nindent 4 }}
    component: database
spec:
  accessModes: [{{ .Values.persistence.accessMode | default "ReadWriteOnce" }}]
  resources:
    requests:
      storage: {{ .Values.persistence.size | default "1Gi" }}
{{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
{{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blablador-token-generator.fullname" . }}
  labels:
    {{- include "blablador-token-generator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "blablador-token-generator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config-secret.yaml") . | sha256sum }}
      labels:
        {{- include "blablador-token-generator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CONFIG_PATH
              value: /app/config/config.yaml
            - name: FORWARDED_ALLOW_IPS
              value: {{ .Values.forwardedAllowIps | quote }}
            {{- if .Values.postgresql.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "blablador-token-generator.fullname" . }}-postgresql
                  key: database-url
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: RATE_LIMIT_STORAGE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "blablador-token-generator.fullname" . }}-redis
                  key: storage-uri
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            {{- if $sqlite }}
            - name: token-db
              mountPath: /app/data
            {{- end }}
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          secret:
            secretName: {{ include "blablador-token-generator.fullname" . }}-config
        {{- if $sqlite }}
        - name: token-db
          persistentVolumeClaim:
            claimName: {{ include "blablador-token-generator.fullname" . }}-db
        {{- end }}
