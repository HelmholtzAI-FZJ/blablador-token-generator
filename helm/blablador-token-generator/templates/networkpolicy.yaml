{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "blablador-token-generator.fullname" . }}
{{- range $component, $port := dict "postgresql" 5432 "redis" 6379 }}
{{- if (index $.Values $component).enabled }}
# Only the token generator pods may reach the bundled {{ $component }}.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-{{ $component }}
  labels:
    {{- include "blablador-token-generator.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $fullname }}-{{ $component }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "blablador-token-generator.selectorLabels" $ | nindent 14 }}
      ports:
        - port: {{ $port }}
          protocol: TCP
---
{{- end }}
{{- end }}
{{- if .Values.networkPolicy.app.enabled }}
{{- if not .Values.networkPolicy.app.from }}
{{- fail "networkPolicy.app.from must list the allowed peers (an empty list would allow everyone)" }}
{{- end }}
# Only the listed peers (ingress controller, API gateway) may reach the app.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "blablador-token-generator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "blablador-token-generator.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- .Values.networkPolicy.app.from | toYaml | nindent 8 }}
      ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
{{- end }}
{{- end }}
