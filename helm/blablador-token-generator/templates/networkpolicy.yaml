{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "blablador-token-generator.fullname" . }}
{{- range $component, $port := dict "postgresql" 5432 "redis" 6379 }}
{{- if (index $.Values $component).enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-{{ $component }}
  labels:
    {{- include "blablador-token-generator.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $fullname }}-{{ $component }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "blablador-token-generator.selectorLabels" $ | nindent 14 }}
        {{- if and (eq $component "postgresql") $.Values.postgresql.backup.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $fullname }}-postgresql-backup
              app.kubernetes.io/instance: {{ $.Release.Name }}
        {{- end }}
      ports:
        - port: {{ $port }}
          protocol: TCP
  egress: []
---
{{- end }}
{{- end }}
{{- if and .Values.postgresql.enabled .Values.postgresql.backup.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-postgresql-backup
  labels:
    {{- include "blablador-token-generator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $fullname }}-postgresql-backup
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $fullname }}-postgresql
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 5432
          protocol: TCP
---
{{- end }}
{{- if .Values.networkPolicy.app.enabled }}
{{- if not .Values.networkPolicy.app.from }}{{- fail "networkPolicy.app.from must identify the ingress/gateway peers" }}{{- end }}
{{- range .Values.networkPolicy.app.from }}
{{- if not . }}{{- fail "Empty networkPolicy.app.from peers would allow everyone" }}{{- end }}
{{- $peer := . }}
{{- range $selector := list "namespaceSelector" "podSelector" }}
{{- if hasKey $peer $selector }}
{{- $match := index $peer $selector }}
{{- if and (not $match.matchLabels) (not $match.matchExpressions) }}{{- fail "App ingress selectors must be explicitly scoped; empty selectors allow every pod/namespace" }}{{- end }}
{{- end }}
{{- end }}
{{- if .ipBlock }}
{{- if or (eq .ipBlock.cidr "0.0.0.0/0") (eq .ipBlock.cidr "::/0") }}{{- fail "App ingress cannot allow every IP" }}{{- end }}
{{- end }}
{{- end }}
{{- if and (eq .Values.config.app.environment "production") .Values.networkPolicy.app.egress.enabled (not .Values.networkPolicy.app.egress.extraRules) }}
{{- fail "networkPolicy.app.egress.extraRules must allow the HTTPS identity provider's destination addresses" }}
{{- end }}
{{- range .Values.networkPolicy.app.egress.extraRules }}
{{- if not .to }}{{- fail "App egress rules must identify explicit destination peers" }}{{- end }}
{{- range .to }}
{{- if not . }}{{- fail "App egress peers cannot be empty" }}{{- end }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "blablador-token-generator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "blablador-token-generator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.app.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - from:
        {{- .Values.networkPolicy.app.from | toYaml | nindent 8 }}
      ports:
        - port: 8080
          protocol: TCP
  {{- if .Values.networkPolicy.app.egress.enabled }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- range $component, $port := dict "postgresql" 5432 "redis" 6379 }}
    {{- if (index $.Values $component).enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $fullname }}-{{ $component }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
      ports:
        - port: {{ $port }}
          protocol: TCP
    {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.app.egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
