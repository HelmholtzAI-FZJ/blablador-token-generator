# Authoring schema migrations. The database comes from the application
# configuration (CONFIG_PATH, DATABASE_URL), not from this file.
#
#   APP_ENVIRONMENT=development uv run alembic revision --autogenerate --rev-id 0003 -m "add something"
#
# Apply migrations with "python -m app.migrate" (the service also applies
# them at startup); see docs/operations/upgrades.md.
[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
