  #     POSTGRES_DB: tokens
  #     POSTGRES_USER: tokens
  #     POSTGRES_PASSWORD: change-me
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  tokens-data:
    driver: local
