version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - tokens-data:/app/data
    environment:
      - CONFIG_PATH=/app/config/config.yaml
    restart: unless-stopped

  # Optional: PostgreSQL for production
  # postgres:
  #   image: postgres:16-alpine
