# Required environment (e.g. in a .env file next to this file):
#   JWT_SECRET_KEY, TOKEN_HASH_KEY, POSTGRES_PASSWORD, REDIS_PASSWORD
# Generate each with: openssl rand -hex 32
services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config/config.yaml:ro
    environment:
      - CONFIG_PATH=/app/config/config.yaml
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      - TOKEN_HASH_KEY=${TOKEN_HASH_KEY:?set TOKEN_HASH_KEY}
      - DATABASE_URL=postgresql+asyncpg://tokens:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/tokens
      - RATE_LIMIT_STORAGE_URI=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tokens
      POSTGRES_DB: tokens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tokens", "-d", "tokens"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

volumes:
  postgres-data:
