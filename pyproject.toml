[project]
name = "token-generator"
version = "1.0.0"
description = "API tokens for Blablador, issued after Helmholtz/JSC (Unity-IDM) OAuth sign-in"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyjwt>=2.8.0",
    "httpx>=0.26.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "bcrypt>=4.1.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "slowapi>=0.1.9",
    "redis>=5.0.0",
    "alembic>=1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "httpx2>=2.13",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.uv]
# An application run from the source tree (and copied into the image), not
# a distributable package: uv installs its dependencies only.
package = false

[tool.ruff]
target-version = "py311"
# Historical audit probes are kept as recorded, not maintained.
extend-exclude = ["security_audit"]

[tool.ruff.lint]
# Ruff's defaults: pyflakes plus syntax and runtime errors. (Bugbear's B008
# flags FastAPI's idiomatic Depends() defaults.)
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
docs = [
    "mkdocs-material>=9.7",
    # MkDocs 2 drops the plugin and theme system Material relies on.
    "mkdocs>=1.6,<2",
]
