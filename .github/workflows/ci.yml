name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Scanners and tools are pinned by digest or hash and use no caches shared
# between runs, so a run cannot influence what a later one checks.
env:
  TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
  GRYPE_IMAGE: anchore/grype:v0.120.1@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe
  HELM_VERSION: v4.2.1
  HELM_SHA256: 479dca836e5b45e8bd222400c5591b0e3a647378f03ff96597180db97c17fdae

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.21"
          enable-cache: false  # nothing a run stores can change a later run
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      - name: Lint Python
        run: uv run --frozen --only-group lint ruff check .
      - name: Check browser scripts parse
        run: for script in app/static/*.js; do node --check "$script"; done

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tokens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tokens"
          --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.21"
          enable-cache: false  # nothing a run stores can change a later run
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras
      - name: Tests (SQLite)
        run: uv run --no-sync pytest -q
      - name: Tests (PostgreSQL)
        run: uv run --no-sync pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tokens
      - name: Audit dependencies for known vulnerabilities
        run: |
          # Production dependencies, and every group CI itself runs.
          uv export --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uv export --frozen --all-groups --all-extras --no-emit-project -o "$RUNNER_TEMP/all-requirements.txt"
          for requirements in requirements all-requirements; do
            uv run --frozen --only-group audit pip-audit -r "$RUNNER_TEMP/$requirements.txt" --require-hashes --disable-pip
          done

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.21"
          enable-cache: false  # nothing a run stores can change a later run
      - name: Install Helm (checksum verified)
        run: |
          curl -fsSLo "$RUNNER_TEMP/helm.tar.gz" "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          sudo install "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras
      - name: Deployment security regressions
        run: |
          uv run --no-sync python helm/blablador-token-generator/tests/security_render.py
          uv run --no-sync python helm/blablador-token-generator/tests/container_risk_gate.py --self-test
      - name: Lint chart
        run: helm lint helm/blablador-token-generator --strict -f helm/blablador-token-generator/ci/test-values.yaml
      - name: Validate rendered manifests against the Kubernetes API
        run: |
          helm template ci helm/blablador-token-generator -f helm/blablador-token-generator/ci/test-values.yaml > rendered.yaml
          docker run --rm -v "$PWD/rendered.yaml:/rendered.yaml:ro" \
            ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary -kubernetes-version 1.31.0 /rendered.yaml

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.21"
          enable-cache: false  # nothing a run stores can change a later run
      - name: Build documentation
        run: uv run --frozen --only-group docs mkdocs build --strict

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: |
          docker build --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" -t token-generator:ci .
          mkdir -p "$RUNNER_TEMP/scan" && docker save token-generator:ci -o "$RUNNER_TEMP/scan/image.tar"
      - name: Scan at all severities, with SBOM
        working-directory: ${{ runner.temp }}/scan
        run: |
          # The scanner sees only the saved image, never the repository (so
          # no trivy.yaml or .trivyignore can change what it reports).
          trivy() { docker run --rm -v "$PWD:/work" "$TRIVY_IMAGE" "$@"; }
          for attempt in 1 2 3; do
            trivy image --cache-dir /work/cache --download-db-only --quiet && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          trivy image --quiet --cache-dir /work/cache --skip-db-update --input /work/image.tar \
            --scanners vuln,secret --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --format json --output /work/trivy-results.json
          trivy image --quiet --cache-dir /work/cache --skip-db-update --input /work/image.tar \
            --format cyclonedx --output /work/image-sbom.json
      - name: Gate unreviewed vulnerabilities
        run: python3 helm/blablador-token-generator/tests/container_risk_gate.py "$RUNNER_TEMP/scan/trivy-results.json" security_audit/container-risk-exceptions.json
      - name: Preserve complete scan and SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-security-evidence
          path: |
            ${{ runner.temp }}/scan/trivy-results.json
            ${{ runner.temp }}/scan/image-sbom.json
          if-no-files-found: error
          retention-days: 30

  datastore-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        component: [postgresql, redis]
    env:
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build hardened datastore
        run: |
          docker build -f "helm/blablador-token-generator/files/Dockerfile.$COMPONENT" -t "token-generator-$COMPONENT:ci" .
          mkdir -p "$RUNNER_TEMP/scan" && docker save "token-generator-$COMPONENT:ci" -o "$RUNNER_TEMP/scan/image.tar"
      - name: Scan packages (Trivy) and server binaries (Grype)
        working-directory: ${{ runner.temp }}/scan
        run: |
          for attempt in 1 2 3; do
            docker run --rm -v "$PWD:/work" "$TRIVY_IMAGE" image --cache-dir /work/cache/trivy --download-db-only --quiet \
              && docker run --rm -v "$PWD:/work" -e GRYPE_DB_CACHE_DIR=/work/cache/grype "$GRYPE_IMAGE" db update \
              && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 20
          done
          docker run --rm -v "$PWD:/work" "$TRIVY_IMAGE" image --quiet --cache-dir /work/cache/trivy --skip-db-update \
            --input /work/image.tar --scanners vuln,secret --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json --output /work/datastore-trivy.json
          docker run --rm -v "$PWD:/work" "$TRIVY_IMAGE" image --quiet --cache-dir /work/cache/trivy --skip-db-update \
            --input /work/image.tar --format cyclonedx --output /work/datastore-sbom.json
          # Trivy sees Alpine packages only; the PostgreSQL and Redis servers
          # are built from source, which Grype's binary cataloguer detects.
          docker run --rm -v "$PWD:/work" -e GRYPE_DB_CACHE_DIR=/work/cache/grype -e GRYPE_DB_AUTO_UPDATE=false \
            "$GRYPE_IMAGE" --quiet -o json docker-archive:/work/image.tar > datastore-grype.json
      - name: Gate unreviewed datastore vulnerabilities
        run: |
          python3 helm/blablador-token-generator/tests/container_risk_gate.py "$RUNNER_TEMP/scan/datastore-trivy.json" security_audit/container-risk-exceptions.json
          python3 helm/blablador-token-generator/tests/container_risk_gate.py --grype "$RUNNER_TEMP/scan/datastore-grype.json" security_audit/container-risk-exceptions.json
      - name: Preserve datastore inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: datastore-${{ matrix.component }}
          path: |
            ${{ runner.temp }}/scan/datastore-trivy.json
            ${{ runner.temp }}/scan/datastore-grype.json
            ${{ runner.temp }}/scan/datastore-sbom.json
          if-no-files-found: error
          retention-days: 30
