name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tokens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tokens"
          --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.21"
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras --no-install-project
      - name: Tests (SQLite)
        run: uv run --no-sync pytest -q
      - name: Tests (PostgreSQL)
        run: uv run --no-sync pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tokens
      - name: Audit dependencies for known vulnerabilities
        run: |
          uv export --frozen --no-dev --no-emit-project -o requirements.txt
          uvx pip-audit==2.10.1 -r requirements.txt --require-hashes --disable-pip

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t token-generator:ci .
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: token-generator:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
