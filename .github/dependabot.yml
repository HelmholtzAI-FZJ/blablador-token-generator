version: 2
# Every ecosystem lets new releases age a week first (cooldown): compromised
# releases are usually found and pulled within days. Security updates are
# not delayed.
updates:
  # Application with a hash-locked lockfile: update uv.lock, leave the
  # version ranges in pyproject.toml alone.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: lockfile-only
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # Base images change the container risk assessments; one PR each.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /helm/blablador-token-generator/files
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
