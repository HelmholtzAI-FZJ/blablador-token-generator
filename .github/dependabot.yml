version: 2
updates:
  # Application with a hash-locked lockfile: update uv.lock, leave the
  # version ranges in pyproject.toml alone.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # Base images change the container risk assessments; one PR each.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /helm/blablador-token-generator/files
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
